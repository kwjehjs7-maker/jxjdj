
name: Build SO2 Match Tracker APK

on:
  workflow_dispatch:
  push:
    paths:
      - "artifacts/so2-match-tracker/android/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        working-directory: artifacts/so2-match-tracker/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SO2-Match-Tracker-APK
          path: artifacts/so2-match-tracker/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
          
